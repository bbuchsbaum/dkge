on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: sinkhorn-oracle

permissions: read-all

jobs:
  sinkhorn-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            github::bbuchsbaum/fmridesign@e627d4d1861e5cc4aea5a5668d6052e394429b92
            github::bbuchsbaum/fmrireg@20c9f07a225f21c4eea1732ea31418ccedd1c056
            local::.

      - name: Run compiled-versus-dense Sinkhorn oracle tests
        run: |
          pkgload::load_all(".", quiet = TRUE)
          testthat::test_local(
            ".",
            filter = "transport-sinkhorn",
            stop_on_failure = TRUE,
            reporter = "summary"
          )
        shell: Rscript {0}
