on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: neuralign-integration

permissions: read-all

jobs:
  neuralign-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            github::bbuchsbaum/delarr@e8bdf22462897049230202a5287e6f1ef88b524a
            github::bbuchsbaum/fmriAR@0c3d04f8d4a7133032b4b07ffe228f8d2e32dd33
            github::bbuchsbaum/fmridesign@e627d4d1861e5cc4aea5a5668d6052e394429b92
            github::bbuchsbaum/fmridataset@1d1204c2edda2a8b004df88eaeb09bac09f6210d
            github::bbuchsbaum/fmrigds@f015b7c7fa5008e2435d269aeb1882a9aa24eaf0
            github::bbuchsbaum/fmrihrf@d366e79fce8db7c5c46e883291e73732b20c545c
            github::bbuchsbaum/fmrilss@f851fb0632f90da12512212af5b80c9623c93fde
            github::bbuchsbaum/fmrireg@20c9f07a225f21c4eea1732ea31418ccedd1c056
            github::bbuchsbaum/neuralign@ae1468340497ef89a32b148946cebdf6dfa42c47
          needs: check
          dependencies: '"hard"'
      - name: Run optional neuralign contract
        run: |
          pkgload::load_all(".", quiet = TRUE)
          testthat::test_local(
            ".", filter = "compat-neuralign",
            stop_on_failure = TRUE, reporter = "summary"
          )
        shell: Rscript {0}
