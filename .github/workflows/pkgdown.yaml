# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::patchwork
            any::ggrepel
            any::tidyr
            any::purrr
            github::bbuchsbaum/delarr@e8bdf22462897049230202a5287e6f1ef88b524a
            github::bbuchsbaum/fmriAR@0c3d04f8d4a7133032b4b07ffe228f8d2e32dd33
            github::bbuchsbaum/fmridesign@e627d4d1861e5cc4aea5a5668d6052e394429b92
            github::bbuchsbaum/fmridataset@1d1204c2edda2a8b004df88eaeb09bac09f6210d
            github::bbuchsbaum/fmrigds@f015b7c7fa5008e2435d269aeb1882a9aa24eaf0
            github::bbuchsbaum/fmrihrf@d366e79fce8db7c5c46e883291e73732b20c545c
            github::bbuchsbaum/fmrilss@f851fb0632f90da12512212af5b80c9623c93fde
            github::bbuchsbaum/fmrireg@20c9f07a225f21c4eea1732ea31418ccedd1c056
            local::.
          needs: website
          dependencies: '"hard"'

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Enable GitHub Pages
        if: github.event_name != 'pull_request'
        run: |
          gh api repos/${{ github.repository }}/pages \
            --method POST --input - <<'EOF' || true
          {"source":{"branch":"gh-pages","path":"/"}}
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
